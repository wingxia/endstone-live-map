name: ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  cpp-core:
    name: C++ core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install C++ dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build zlib1g-dev
      - name: Configure
        run: cmake -S plugin -B plugin/build-core -GNinja -DLIVE_MAP_WITH_ENDSTONE=OFF
      - name: Build
        run: cmake --build plugin/build-core
      - name: Test
        run: ctest --test-dir plugin/build-core --output-on-failure

  endstone-plugin:
    name: Endstone plugin build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 20 and C++ dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg

          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-snapshot.gpg.key
          key_fingerprint="$(gpg --show-keys --with-colons /tmp/llvm-snapshot.gpg.key | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$key_fingerprint" = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          gpg --batch --yes --dearmor --output /tmp/apt.llvm.org.gpg /tmp/llvm-snapshot.gpg.key
          sudo install -m 0644 /tmp/apt.llvm.org.gpg /usr/share/keyrings/apt.llvm.org.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" |
            sudo tee /etc/apt/sources.list.d/apt.llvm.org.list >/dev/null

          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-20 libc++-20-dev libc++abi-20-dev libcurl4-openssl-dev zlib1g-dev
          clang++-20 --version
      - name: Configure
        run: cmake -S plugin -B plugin/build-endstone -GNinja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DLIVE_MAP_WITH_ENDSTONE=ON -DENDSTONE_API_VERSION=0.11.6
      - name: Build
        run: cmake --build plugin/build-endstone --target endstone_live_map
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: endstone-live-map-plugin-linux-x86_64
          path: |
            plugin/build-endstone/*.so
            plugin/build-endstone/**/*.so
          if-no-files-found: error

  web-worker:
    name: Worker and frontend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: E2E tests
        run: npm run test:e2e
